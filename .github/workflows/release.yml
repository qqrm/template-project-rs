name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Build
        # This library template intentionally does not commit Cargo.lock.
        run: cargo build --release

      - name: Package artifact
        env:
          ARCHIVE_REPOSITORY: ${{ github.event.repository.name }}
          ARCHIVE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          archive_name="${ARCHIVE_REPOSITORY}-${ARCHIVE_TAG}-x86_64-unknown-linux-gnu.tar.gz"
          tar -czf "dist/${archive_name}" -C target/release .

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --generate-notes
